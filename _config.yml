title: soulism
lang: de
timezone: Europe/Berlin
url: "https://soulism.de"

# GitHub-Repository (owner/name), für den Link auf den Build-Stand im Footer
repository: odrotbohm/soulism.de

# Favicon-Set aus assets/favicons/<name>/, pro Seite überschreibbar
defaults:
  - scope:
      path: ""
    values:
      favicon: soulism

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .ruby-version
  - deploy.sh
  - deploy.env
  - deploy.env.example

port: 4001
