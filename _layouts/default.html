<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preload" href="{{ '/assets/fonts/outfit-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {{ content }}
  <footer class="site-footer">
    {{ site.time | date: "%d.%m.%Y, %H:%M" }}
    {%- if site.data.hash and site.data.hash != "" %} ·
      {% if site.repository %}<a href="https://github.com/{{ site.repository }}/tree/{{ site.data.hash }}"><code>{{ site.data.hash }}</code></a>
      {%- else %}<code>{{ site.data.hash }}</code>{% endif %}
    {%- endif %}
  </footer>
</body>
</html>
